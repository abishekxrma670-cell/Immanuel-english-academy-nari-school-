<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Immanuel English Academy — Result</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:900px;margin:auto;padding:24px}.hero{background:#2447a8;color:white;padding:28px;border-radius:18px}.card{background:white;border:1px solid #e4e8ef;border-radius:16px;padding:22px;margin-top:18px}input,button{padding:12px;border-radius:9px;font-size:16px}input{width:65%;border:1px solid #ccd3df}button{background:#2447a8;color:#fff;border:0;font-weight:700}.row{display:flex;gap:10px}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#f7f9fc;padding:12px;border-radius:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}@media(max-width:650px){.row{flex-direction:column}input{width:auto}.stats{grid-template-columns:repeat(2,1fr)}.table{font-size:13px}}.pass{color:green;font-weight:bold}.fail{color:#b00020;font-weight:bold}.pending{color:#9a6500;font-weight:bold}</style></head><body><div class="wrap"><div class="hero"><h1>IMMANUEL ENGLISH ACADEMY</h1><div>NARI, LOWER SIANG DIST., ARUNACHAL PRADESH</div><h2>FIRST PERIODIC TEST — CLASS II</h2></div><div class="card"><h2>Check Student Result</h2><p>Enter roll number or student name.</p><div class="row"><input id="q" placeholder="e.g. 18 or student name"><button onclick="search()">Search</button></div><div id="matches"></div></div><div id="result" class="card hidden"></div><div class="card"><b>Rules:</b> Full mark = 40 per subject. Pass mark = 16 (40%). Rank is calculated from Grand Total among all 7 subjects.</div></div><script>const S=[
[1,'Martha Basar',16.5,30.5,20,30,21,40,35],[2,'Onuibe Sarati',32,36,31.5,32.5,33.5,38,40],[3,'Rehgram Bonjig',16.5,35.5,33.5,34,32.5,39,31],[4,'Noya Bina',27,29.5,22,29,33.5,34.5,36],[5,'Luter Estir Yumpa',18,32.5,22,26,32,35.5,37],[6,'Juche Givram',32.5,29,17.5,17,26,27,36],[7,'Bomhi Bomjen',31.5,35,32.5,33.5,36.5,37,37],[8,'Jumyei Baje',32,32.5,28.5,28,31,33,34],[9,'Jobi Reram',32,31.5,22.5,25.5,22.5,30.5,26],[10,'Jyum Dabri',33,38.5,36.5,38,28,37,39],[11,'Kengzina Nyadu',37.5,34,36,40,30,39.5,40],[12,'Kenter Riba',31,36,33,36,34.5,35,38.5],[13,'Terisa Tame',33,37,37.5,35,37,39.5,38.5],[14,'Ahan Ali',30,13,16,23,10,36,34],[15,'Ngankor Menam',16.5,29.5,19.5,32,23.5,32.5,32.5],[16,'Darge Esri',20,24.5,6.5,19,27.5,31.5,36],[17,'Delviji Basumatary',35,34,16,17,30,23.5,32],[18,'Borken Dali',36,37,38.5,40,37.5,40,40],[19,'Pele Bomjen',35,30,20,19,28.5,28.5,36],[20,'Paramjal Biswakar',36,29,10,30,33.5,32,35],[21,'Maryng Kaye',23,28,16,25.5,36.5,22.5,32],[22,'Bui Bonjen',10,9,8,20,16,12.5,22.5],[23,'Gato Riba',35,34.5,35.5,35,32.5,37.5,39],[24,'Dewir Bonjen',20.5,25,8,24,27,19.5,28],[25,'Alex Karki Dabi',10,24,13,26.5,26,25.5,31]
];const N=['Mathematics','Hindi','English','English Grammar','Hindi Grammar','Science','GK'];function gd(p){return p>=90?'A+':p>=80?'A':p>=70?'B+':p>=60?'B':p>=50?'C':p>=40?'D':'F'}function getRank(x){let a=S.map(s=>({id:s[0],total:s.slice(2).reduce((u,v)=>u+v,0)})).sort((a,b)=>b.total-a.total);return a.findIndex(s=>s.id===x[0])+1}function search(){let q=document.getElementById('q').value.trim().toLowerCase();let a=S.filter(x=>String(x[0])===q||x[1].toLowerCase().includes(q));document.getElementById('matches').innerHTML=a.map(x=>`<div class='card' onclick='show(${x[0]})'><b>${x[1]}</b> — Roll ${x[0]}</div>`).join('')||'<p>No student found.</p>';if(a.length===1)show(a[0][0])}function show(r){let x=S.find(y=>y[0]===r),vals=x.slice(2),total=vals.reduce((a,b)=>a+b,0),pct=total/(7*40)*100,overall=vals.every(v=>v>=16),rank=getRank(x);let rows=N.map((n,i)=>{let v=vals[i],p=v/40*100;return `<tr><td>${n}</td><td>${v}</td><td>${p.toFixed(2)}%</td><td>${gd(p)}</td><td class='${v>=16?'pass':'fail'}'>${v>=16?'PASS':'FAIL'}</td></tr>`}).join('');document.getElementById('result').classList.remove('hidden');document.getElementById('result').innerHTML=`<h2>${x[1]}</h2><p>Roll No. ${x[0]}</p><div class='stats'><div class='stat'><b>Rank</b><br>#${rank}</div><div class='stat'><b>Grand Total</b><br>${total.toFixed(1)} / 280</div><div class='stat'><b>Percentage</b><br>${pct.toFixed(2)}%</div><div class='stat'><b>Overall Grade</b><br>${gd(pct)}</div><div class='stat'><b>Overall Result</b><br><span class='${overall?'pass':'fail'}'>${overall?'PASS':'FAIL'}</span></div></div><table class='table'><tr><th>Subject</th><th>Marks</th><th>Percentage</th><th>Grade</th><th>Result</th></tr>${rows}</table>`}</script></body></html>
